<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login | Love Gallery</title>
<link rel="icon" href="assets/img/favicon.png">
<style>
  :root{--bg:#0f1117;--card:#1a1d27;--card2:#222634;--line:#2e3345;--txt:#e8eaf1;--mut:#8b90a5;--pink:#ff4d79;--pink2:#ff7a9c;--bad:#ff5252;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:radial-gradient(1200px 600px at 50% -10%,#241726,var(--bg));color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:42px 38px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .heart{font-size:34px;margin-bottom:8px}
  h1{font-size:21px;font-weight:600;margin-bottom:4px}
  h1 span{color:var(--pink)}
  p.sub{color:var(--mut);font-size:13px;margin-bottom:26px}
  label{display:block;text-align:left;font-size:12px;color:var(--mut);margin:12px 0 5px;letter-spacing:.4px}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 14px;font-size:14px}
  input:focus{outline:none;border-color:var(--pink)}
  button{width:100%;margin-top:22px;cursor:pointer;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;background:var(--pink);color:#fff;transition:.15s}
  button:hover{background:var(--pink2)}
  #err{color:var(--bad);font-size:12.5px;margin-top:12px;min-height:16px}
  .back{display:inline-block;margin-top:18px;color:var(--mut);font-size:12.5px;text-decoration:none}
  .back:hover{color:var(--pink2)}
  .shake{animation:sh .35s}
  @keyframes sh{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="heart">🔐</div>
  <h1>Love Gallery <span>Admin</span></h1>
  <p class="sub">Authorized access only</p>
  <label>USERNAME</label>
  <input id="u" autocomplete="username" placeholder="Username">
  <label>PASSWORD</label>
  <input id="p" type="password" autocomplete="current-password" placeholder="Password">
  <button onclick="tryLogin()">Sign In</button>
  <div id="err"></div>
  <a class="back" href="/">← Back to website</a>
</div>
<script>
const AUTH_HASH='7d5f8c6f4b7df76b5474701f3b3724f0d0c93a51ee9f4a48b77006277b0c7c62';
if(sessionStorage.getItem('lg_auth')==='1'){location.replace('dashboard.html')}
function sha256(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  var mp=Math.pow,mw=mp(2,32),res='',words=[],len=ascii.length*8,hash=[],k=[],pc=0,isC={};
  for(var c=2;pc<64;c++){if(!isC[c]){for(var i=0;i<313;i+=c){isC[i]=c}hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((len/mw)|0);words[words.length]=(len);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=(b<16?0:'')+b.toString(16)}
  return res;
}
async function tryLogin(){
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  if(!u||!p)return err('Enter both fields');
  const h=sha256(u.toLowerCase()+'::'+p);
  if(h===AUTH_HASH){sessionStorage.setItem('lg_auth','1');location.href='dashboard.html'}
  else err('Wrong username or password');
}
function err(m){document.getElementById('err').textContent=m;document.getElementById('box').classList.remove('shake');void document.getElementById('box').offsetWidth;document.getElementById('box').classList.add('shake')}
document.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
</script>
</body>
</html>
